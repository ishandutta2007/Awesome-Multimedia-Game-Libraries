<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#161536" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#3b82f6;#06b6d4;#a855f7" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#8b5cf6;#ec4899;#38bdf8" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb2" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb3" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="glow-text" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.85; }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes floatCubeReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-5deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-380px); opacity: 0; }
      50% { opacity: 0.25; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes eqBar {
      0%, 100% { height: 12px; }
      50% { height: 38px; }
    }
    .orb-glow-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 20% 30%; }
    .orb-glow-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 80% 60%; }
    .floating-shape-1 { animation: floatCube 6s ease-in-out infinite; }
    .floating-shape-2 { animation: floatCubeReverse 7s ease-in-out infinite; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .body-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1280" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Ambient Orbs -->
  <circle class="orb-glow-1" cx="240" cy="110" r="220" fill="url(#orb1)" />
  <circle class="orb-glow-2" cx="1060" cy="220" r="260" fill="url(#orb2)" />
  <circle cx="640" cy="300" r="280" fill="url(#orb3)" />

  <!-- Perspective Floor Grid (Dynamic Low-Opacity Background) -->
  <g opacity="0.15">
    <line x1="0" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="160" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="320" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="480" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="640" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="800" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="960" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="1120" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="1280" y1="380" x2="640" y2="240" stroke="#6366f1" stroke-width="1.2" />
    <line x1="140" y1="350" x2="1140" y2="350" stroke="#6366f1" stroke-width="1" />
    <line x1="280" y1="320" x2="1000" y2="320" stroke="#6366f1" stroke-width="1" />
    <line x1="400" y1="290" x2="880" y2="290" stroke="#6366f1" stroke-width="1" />
    <line x1="500" y1="265" x2="780" y2="265" stroke="#6366f1" stroke-width="1" />
  </g>

  <!-- Ambient Dynamic Floating Graphic Elements (In Background / Off to the sides) -->
  <g class="floating-shape-1" opacity="0.35">
    <!-- Isometric 3D Cube (Left) -->
    <polygon points="100,70 140,50 180,70 140,90" fill="#6366f1" />
    <polygon points="100,70 140,90 140,140 100,120" fill="#4338ca" />
    <polygon points="180,70 140,90 140,140 180,120" fill="#4f46e5" />
  </g>

  <g class="floating-shape-2" opacity="0.3">
    <!-- Isometric 3D Diamond (Right) -->
    <polygon points="1150,90 1190,65 1230,90 1190,115" fill="#ec4899" />
    <polygon points="1150,90 1190,115 1190,165 1150,140" fill="#be185d" />
    <polygon points="1230,90 1190,115 1190,165 1230,140" fill="#db2777" />
  </g>

  <!-- Dynamic Equalizer / Audio Waveform Bars (Bottom Left Accent) -->
  <g transform="translate(60, 310)" opacity="0.5">
    <rect x="0" y="0" width="4" height="24" rx="2" fill="#38bdf8">
      <animate attributeName="height" values="8;28;14;32;8" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;0;14;-4;20" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="8" y="0" width="4" height="34" rx="2" fill="#818cf8">
      <animate attributeName="height" values="30;12;38;16;30" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-2;16;-10;12;-2" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="16" y="0" width="4" height="18" rx="2" fill="#a855f7">
      <animate attributeName="height" values="14;36;10;28;14" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="14;-8;18;0;14" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="24" y="0" width="4" height="28" rx="2" fill="#ec4899">
      <animate attributeName="height" values="24;8;34;18;24" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="4;20;-6;10;4" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <rect x="32" y="0" width="4" height="16" rx="2" fill="#f43f5e">
      <animate attributeName="height" values="12;26;8;32;12" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="16;2;20;-4;16" dur="1.9s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Dynamic Game Controller Wireframe Accent (Bottom Right Accent) -->
  <g transform="translate(1160, 305)" opacity="0.45">
    <!-- D-Pad -->
    <rect x="0" y="8" width="24" height="8" rx="2" fill="#64748b" />
    <rect x="8" y="0" width="8" height="24" rx="2" fill="#64748b" />
    <!-- Action Buttons -->
    <circle cx="48" cy="6" r="3" fill="#ec4899">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="56" cy="14" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="14" r="3" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="48" cy="22" r="3" fill="#f59e0b">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND LAYER: CRISP, UNCLUTTERED, UNBLOCKED CONTENT -->

  <!-- Top Pill / Status Tag -->
  <g transform="translate(640, 56)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-146" cy="0" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text class="badge-text" x="5" y="4" text-anchor="middle" fill="#c7d2fe">CURATED MULTIMEDIA &amp; GAME DEV STACK</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(640, 138)">
    <text class="title-text" x="0" y="0" text-anchor="middle" font-size="46" fill="#ffffff" filter="url(#glow-text)">
      Awesome Multimedia &amp; Game Libraries
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(640, 185)">
    <text class="body-text" x="0" y="0" text-anchor="middle" font-size="18" fill="#94a3b8" letter-spacing="0.2px">
      Cross-Platform Game Engines, DirectMedia Abstraction Frameworks &amp; Low-Level Graphics APIs
    </text>
  </g>

  <!-- Feature Cards / Technology Category Pills (Foreground Row) -->
  <g transform="translate(640, 260)">
    <!-- Pill 1: Low-Level Abstraction -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="url(#card-border)" stroke-width="1.2" filter="url(#shadow-card)" />
      <text class="body-text" x="20" y="24" font-size="13" font-weight="700" fill="#f8fafc">⚡ Low-Level Abstraction</text>
      <text class="body-text" x="20" y="40" font-size="11" fill="#64748b">SDL3 • SFML • GLFW • Raylib</text>
    </g>

    <!-- Pill 2: Game Engines -->
    <g transform="translate(-225, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="url(#card-border)" stroke-width="1.2" filter="url(#shadow-card)" />
      <text class="body-text" x="20" y="24" font-size="13" font-weight="700" fill="#f8fafc">🎮 Game Engines</text>
      <text class="body-text" x="20" y="40" font-size="11" fill="#64748b">Godot • Bevy • Unity • Defold</text>
    </g>

    <!-- Pill 3: Audio & Multimedia -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="url(#card-border)" stroke-width="1.2" filter="url(#shadow-card)" />
      <text class="body-text" x="20" y="24" font-size="13" font-weight="700" fill="#f8fafc">🔊 Positional Audio</text>
      <text class="body-text" x="20" y="40" font-size="11" fill="#64748b">OpenAL Soft • SoLoud • miniaudio</text>
    </g>

    <!-- Pill 4: Web & 2D Graphics -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="215" height="52" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="url(#card-border)" stroke-width="1.2" filter="url(#shadow-card)" />
      <text class="body-text" x="20" y="24" font-size="13" font-weight="700" fill="#f8fafc">🌐 Web &amp; 2D Graphics</text>
      <text class="body-text" x="20" y="40" font-size="11" fill="#64748b">Phaser • Babylon.js • Cocos2d-x</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="376" width="1280" height="4" fill="url(#primary-glow)" />
</svg>